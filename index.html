<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуни — MMORPG</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Шрифти в середньовічному стилі -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=MedievalSharp&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0a08;
            --panel-bg: rgba(22, 17, 13, 0.95);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8a6d1b;
            --border-color: #4a3821;
            --text-main: #e0d5c1;
            
            /* Рідкісність предметів */
            --rarity-common: #9d9d9d;
            --rarity-uncommon: #1eff00;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-legendary: #ff8000;
            --rarity-mythic: #e6cc80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at center, rgba(35, 22, 12, 0.85) 0%, rgba(5, 3, 2, 0.98) 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 15px;
        }

        /* Шапка */
        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 2px 2px 4px #000;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            font-family: 'MedievalSharp', cursive;
            font-size: 13px;
            color: var(--gold-primary);
            margin-top: 2px;
        }

        /* Картка користувача */
        .user-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            background: #2a1f18;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-details .name {
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }

        .spins-count {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold-dark);
            padding: 4px 10px;
            border-radius: 15px;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: var(--gold-light);
            font-size: 13px;
        }

        /* Контейнер Колеса */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(0,0,0,0) 70%);
            animation: pulseGlow 3s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1.08); opacity: 0.9; }
        }

        .wheel-frame {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 8px solid #2d1e12;
            box-shadow: 
                0 0 0 3px var(--gold-primary),
                inset 0 0 15px rgba(0,0,0,0.9),
                0 10px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }

        /* Стрілка-вказівник */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 35px;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 32px solid var(--gold-light);
        }

        .pointer::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--gold-dark);
            z-index: 1;
        }

        canvas#wheelCanvas {
            width: 304px;
            height: 304px;
            border-radius: 50%;
            z-index: 2;
        }

        canvas#particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .center-hub {
            position: absolute;
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #4a3821 0%, #1a1008 100%);
            border: 3px solid var(--gold-primary);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Кнопка "Крутити" */
        .spin-btn {
            margin-top: 15px;
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1b 100%);
            border: 2px solid var(--gold-light);
            border-radius: 8px;
            padding: 14px 40px;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 900;
            color: #1a0f05;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.5);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 320px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(212, 175, 55, 0.4);
        }

        .spin-btn:disabled {
            background: linear-gradient(180deg, #4a4035 0%, #26201a 100%);
            border-color: #55483a;
            color: #776857;
            text-shadow: none;
            cursor: not-allowed;
        }

        /* Модальне вікно виграшу */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .reward-card {
            background: var(--panel-bg);
            border: 3px solid var(--gold-primary);
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .reward-card {
            transform: scale(1);
        }

        .reward-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .reward-card p.subtitle {
            font-size: 11px;
            color: #a0907a;
            margin-bottom: 15px;
        }

        .reward-icon-frame {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            border-radius: 10px;
            border: 2px solid var(--gold-primary);
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .reward-name {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .reward-rarity {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .claim-btn {
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1b 100%);
            border: 1px solid var(--gold-light);
            color: #1a0f05;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 14px;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .claim-btn:hover {
            background: linear-gradient(180deg, #e6cc80 0%, #a38226 100%);
        }
    </style>
</head>
<body>

    <header>
        <h1>Колесо Фортуни</h1>
        <p>Випробуй свою долю, Воїне!</p>
    </header>

    <div class="user-card">
        <div class="user-info">
            <div class="user-avatar" id="uAvatar">⚔️</div>
            <div class="user-details">
                <div class="name" id="uName">Лицар</div>
            </div>
        </div>
        <div class="spins-count">
            Спіни: <span id="spinsVal" style="color: #fff;">1</span>
        </div>
    </div>

    <div class="wheel-container">
        <div class="wheel-glow"></div>
        <div class="wheel-frame"></div>
        <div class="pointer"></div>
        <div class="center-hub">💎</div>
        <canvas id="wheelCanvas" width="608" height="608"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">Крутити Колесо</button>

    <canvas id="particleCanvas"></canvas>

    <!-- Модальне вікно виграшу -->
    <div class="modal-overlay" id="rewardModal">
        <div class="reward-card">
            <h2>Нагороду Здобуто!</h2>
            <p class="subtitle">Предмет передається в інвентар бота...</p>

            <div class="reward-icon-frame" id="modalIconFrame">
                <span id="modalIcon">🗡️</span>
            </div>

            <div class="reward-name" id="modalName">Меч Дракона</div>
            <div class="reward-rarity" id="modalRarity">Легендарний</div>

            <button class="claim-btn" id="claimBtn">Забрати в Боті</button>
        </div>
    </div>

    <script>
        // --- Налаштування Предметів Колеса ---
        const ITEMS = [
            { id: "gold_100",    name: "100 Золота",     icon: "💰", rarity: "Звичайний",   color: "#3a3028", textCol: "#e0d5c1", rarityColor: "var(--rarity-common)" },
            { id: "potion_hp",   name: "Зілля ХП",        icon: "🧪", rarity: "Незвичайний",color: "#1b3b1e", textCol: "#85f089", rarityColor: "var(--rarity-uncommon)" },
            { id: "sword_epic",  name: "Меч Тіней",      icon: "🗡️", rarity: "Епічний",    color: "#3a1b4d", textCol: "#d385f0", rarityColor: "var(--rarity-epic)" },
            { id: "gold_500",    name: "500 Золота",     icon: "🪙", rarity: "Незвичайний",color: "#2a2213", textCol: "#f0d585", rarityColor: "var(--rarity-uncommon)" },
            { id: "shield_rare", name: "Щит Лицаря",    icon: "🛡️", rarity: "Рідкісний",   color: "#182b45", textCol: "#85c4f0", rarityColor: "var(--rarity-rare)" },
            { id: "scroll_exp",  name: "Сувій Досвіду",  icon: "📜", rarity: "Рідкісний",   color: "#182b45", textCol: "#85c4f0", rarityColor: "var(--rarity-rare)" },
            { id: "helm_dragon", name: "Шолом Дракона", icon: "👑", rarity: "Легендарний",color: "#4d2800", textCol: "#f0ab85", rarityColor: "var(--rarity-legendary)" },
            { id: "chest_myth",  name: "Скриня Богів",   icon: "🧰", rarity: "Міфічний",   color: "#4d4218", textCol: "#f0e185", rarityColor: "var(--rarity-mythic)" }
        ];

        // --- Ініціалізація Telegram WebApp ---
        const tg = window.Telegram?.WebApp;
        let userData = { first_name: "Лицар" };

        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userData = tg.initDataUnsafe.user;
            }
        }

        document.getElementById('uName').innerText = userData.first_name || "Лицар";
        document.getElementById('uAvatar').innerText = (userData.first_name ? userData.first_name[0] : "⚔️");

        // Змінні стану
        let spinsCount = 1;
        let isSpinning = false;
        let currentAngle = 0;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');

        function resizeParticleCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeParticleCanvas);
        resizeParticleCanvas();

        // --- Web Audio API (Звуки) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playClickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, now + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.3);
            });
        }

        // --- Малювання Колеса ---
        const numSlices = ITEMS.length;
        const sliceAngle = (2 * Math.PI) / numSlices;

        function drawWheel() {
            const width = canvas.width;
            const center = width / 2;
            const radius = center - 8;

            ctx.clearRect(0, 0, width, width);

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;
                const item = ITEMS[i];

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#2d1e12";
                ctx.stroke();

                // Текст та іконка
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";

                ctx.font = "32px serif";
                ctx.fillText(item.icon, radius - 20, 10);

                ctx.fillStyle = item.textCol;
                ctx.font = "bold 16px Cinzel, serif";
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 4;
                ctx.fillText(item.name, radius - 65, 5);

                ctx.restore();
            }
        }

        drawWheel();

        // --- Логіка Обертання ---
        let lastSoundAngle = 0;
        let pendingReward = null;

        function spin() {
            if (isSpinning || spinsCount <= 0) return;

            initAudio();
            isSpinning = true;
            spinsCount--;
            document.getElementById('spinsVal').innerText = spinsCount;
            document.getElementById('spinBtn').disabled = true;

            const winningIndex = Math.floor(Math.random() * numSlices);
            const targetSliceMiddle = winningIndex * sliceAngle + sliceAngle / 2;
            const stopAngle = (3 * Math.PI / 2) - targetSliceMiddle;
            const extraRounds = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            
            const startAngle = currentAngle % (2 * Math.PI);
            const totalRotation = extraRounds + (stopAngle - startAngle);
            
            const duration = 4500;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);

                currentAngle = startAngle + totalRotation * easeOut;
                drawWheel();

                if (Math.abs(currentAngle - lastSoundAngle) >= sliceAngle) {
                    playClickSound();
                    lastSoundAngle = currentAngle;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    pendingReward = ITEMS[winningIndex];
                    onSpinEnd(pendingReward);
                }
            }

            requestAnimationFrame(animate);
        }

        function onSpinEnd(item) {
            playWinSound();
            spawnParticles();

            document.getElementById('modalIcon').innerText = item.icon;
            document.getElementById('modalName').innerText = item.name;
            document.getElementById('modalName').style.color = item.rarityColor;
            document.getElementById('modalRarity').innerText = item.rarity;
            document.getElementById('modalRarity').style.color = item.rarityColor;
            document.getElementById('modalIconFrame').style.borderColor = item.rarityColor;

            document.getElementById('rewardModal').classList.add('active');
        }

        // --- Ефект Часток / Іскор ---
        let particles = [];

        function spawnParticles() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2 - 40,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.7) * 10,
                    size: Math.random() * 5 + 2,
                    color: ['#d4af37', '#f3e5ab', '#ff8000', '#ffffff'][Math.floor(Math.random() * 4)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
            animateParticles();
        }

        function animateParticles() {
            if (particles.length === 0) return;

            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    pCtx.save();
                    pCtx.globalAlpha = p.alpha;
                    pCtx.fillStyle = p.color;
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    pCtx.fill();
                    pCtx.restore();
                }
            });

            requestAnimationFrame(animateParticles);
        }

        document.getElementById('spinBtn').addEventListener('click', spin);

        // При натисканні "Забрати" надсилаємо дані у Telegram WebApp SDK і закриваємо вікно
        document.getElementById('claimBtn').addEventListener('click', () => {
            if (tg && pendingReward) {
                const payload = {
                    item_id: pendingReward.id,
                    item_name: pendingReward.name,
                    rarity: pendingReward.rarity,
                    timestamp: Math.floor(Date.now() / 1000)
                };
                
                // Передаємо дані у чат бота
                tg.sendData(JSON.stringify(payload));
            } else {
                document.getElementById('rewardModal').classList.remove('active');
            }
        });
    </script>
</body>
</html>
